# Alternative to GitHub Actions. Codemagic free tier: 500 macOS minutes/month.
workflows:
  unsigned-ipa:
    name: Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build (no code signing)
        script: |
          xcodebuild \
            -project PhotoCleaner.xcodeproj \
            -scheme PhotoCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoCleaner.app ipa/Payload/
          cd ipa && zip -qry PhotoCleaner.ipa Payload
    artifacts:
      - ipa/PhotoCleaner.ipa
