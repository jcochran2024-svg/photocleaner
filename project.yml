name: PhotoCleaner
options:
  bundleIdPrefix: com.johnny
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: NO
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources:
      - path: PhotoCleaner
        excludes:
          - "ML/NSFW-MODEL-LICENSE.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnny.photocleaner
        PRODUCT_NAME: PhotoCleaner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoCleaner/Info.plist
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: PhotoCleaner/Info.plist
      properties:
        CFBundleDisplayName: PhotoCleaner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "PhotoCleaner scans and cleans your photo library entirely on this iPhone. Nothing is ever uploaded."
        NSFaceIDUsageDescription: "Face ID locks the private scanner results so only you can see them."
        ITSAppUsesNonExemptEncryption: false
